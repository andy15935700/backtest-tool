const STRATEGIES = {
  bollinger: "布林通道 %B",

};

// ── Math ─────────────────────────────────────────────────────────────────────
const mean   = a => a.reduce((s,v)=>s+v,0)/a.length;
const stddev = a => { const m=mean(a); return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length); };

function calcBollinger(prices, period=20, mult=2) {
  return prices.map((_,i) => {
    if (i<period-1) return {pctB:null};
    const sl=prices.slice(i-period+1,i+1), m=mean(sl), sd=stddev(sl);
    const upper=m+mult*sd, lower=m-mult*sd;
    return {upper,lower,mid:m,pctB:(prices[i]-lower)/(upper-lower||1e-9)};
  });
}
function calcRSI(prices, period=14) {
  const rsi=new Array(prices.length).fill(null);
  let ag=0,al=0;
  for(let i=1;i<=period;i++){const d=prices[i]-prices[i-1];if(d>0)ag+=d/period;else al+=Math.abs(d)/period;}
  rsi[period]=100-100/(1+ag/(al||1e-9));
  for(let i=period+1;i<prices.length;i++){
    const d=prices[i]-prices[i-1];
    ag=(ag*(period-1)+(d>0?d:0))/period;
    al=(al*(period-1)+(d<0?-d:0))/period;
    rsi[i]=100-100/(1+ag/(al||1e-9));
  }
  return rsi;
}
function calcEMA(prices, period) {
  const k=2/(period+1), ema=new Array(prices.length).fill(null);
  ema[period-1]=mean(prices.slice(0,period));
  for(let i=period;i<prices.length;i++) ema[i]=prices[i]*k+ema[i-1]*(1-k);
  return ema;
}
function calcMACD(prices, fast=12, slow=26, sig=9) {
  const ef=calcEMA(prices,fast), es=calcEMA(prices,slow);
  const ml=prices.map((_,i)=>ef[i]!=null&&es[i]!=null?ef[i]-es[i]:null);
  const sl=calcEMA(ml.map(v=>v??0),sig);
  return ml.map((m,i)=>({macd:m,signal:sl[i]}));
}

// ── Backtest ─────────────────────────────────────────────────────────────────
function runBacktest(prices, dates, strategy, params) {
  let pos=null, cash=100, shares=0;
  const trades=[], equity=[{date:dates[0],value:100}];
  const boll = strategy==="bollinger" ? calcBollinger(prices,params.bollPeriod,params.bollMult) : null;
  const rsi  = strategy==="rsi"       ? calcRSI(prices,params.rsiPeriod) : null;
  const ef   = strategy==="ma_cross"  ? calcEMA(prices,params.maFast) : null;
  const es   = strategy==="ma_cross"  ? calcEMA(prices,params.maSlow) : null;
  const macd = strategy==="macd"      ? calcMACD(prices,params.macdFast,params.macdSlow,params.macdSignal) : null;

  for(let i=1;i<prices.length;i++){
    const p=prices[i]; let buy=false, sell=false;
    if(strategy==="bollinger"){
      const {pctB:pb}=boll[i],{pctB:pp}=boll[i-1];
      if(pb!=null&&pp!=null){buy=pb<params.bollBuy&&pp>=params.bollBuy;sell=pb>params.bollSell&&pp<=params.bollSell;}
    } else if(strategy==="rsi"){
      if(rsi[i]!=null&&rsi[i-1]!=null){buy=rsi[i]<params.rsiBuy&&rsi[i-1]>=params.rsiBuy;sell=rsi[i]>params.rsiSell&&rsi[i-1]<=params.rsiSell;}
    } else if(strategy==="ma_cross"){
      if(ef[i]&&es[i]&&ef[i-1]&&es[i-1]){buy=ef[i]>es[i]&&ef[i-1]<=es[i-1];sell=ef[i]<es[i]&&ef[i-1]>=es[i-1];}
    } else if(strategy==="macd"){
      const c=macd[i],pv=macd[i-1];
      if(c.macd!=null&&pv.macd!=null){buy=c.macd>c.signal&&pv.macd<=pv.signal;sell=c.macd<c.signal&&pv.macd>=pv.signal;}
    }
    if(!pos&&buy){pos={ep:p,ed:dates[i],ei:i};shares=cash/p;cash=0;}
    else if(pos&&sell){
      trades.push({ed:pos.ed,xd:dates[i],ep:pos.ep,xp:p,ret:(p-pos.ep)/pos.ep,days:i-pos.ei});
      cash=shares*p;shares=0;pos=null;
    }
    equity.push({date:dates[i],value:+((pos?shares*p:cash)).toFixed(4)});
  }
  if(pos){
    const lp=prices[prices.length-1];
    trades.push({ed:pos.ed,xd:dates[dates.length-1],ep:pos.ep,xp:lp,ret:(lp-pos.ep)/pos.ep,days:prices.length-1-pos.ei,open:true});
    equity[equity.length-1].value=+(shares*lp).toFixed(4);
  }
  const bhEquity=prices.map((p,i)=>({date:dates[i],bh:+((p/prices[0])*100).toFixed(4)}));
  let peak=100,maxDD=0;
  for(const e of equity){if(e.value>peak)peak=e.value;const dd=(peak-e.value)/peak;if(dd>maxDD)maxDD=dd;}
  const rets=equity.slice(1).map((e,i)=>e.value/equity[i].value-1);
  const avgR=mean(rets),retSd=stddev(rets);
  const sharpe=retSd>0?(avgR/retSd)*Math.sqrt(52):0;
  const wins=trades.filter(t=>t.ret>0);
  const fin=equity[equity.length-1].value;
  return {equity,bhEquity,trades,stats:{
    totalReturn:fin-100,bhReturn:(prices[prices.length-1]/prices[0]-1)*100,
    numTrades:trades.length,winRate:trades.length>0?wins.length/trades.length:0,
    maxDD:maxDD*100,sharpe,
    avgReturn:trades.length>0?mean(trades.map(t=>t.ret))*100:0,
    avgDays:trades.length>0?mean(trades.map(t=>t.days)):0,
  }};
}

// ── Data Sources ──────────────────────────────────────────────────────────────
function parseStooqCSV(text) {
  const lines = text.trim().split('\n').slice(1); // skip header
  const rows = lines
    .map(l => { const p=l.split(','); return {date:p[0],close:parseFloat(p[4])}; })
    .filter(r => !isNaN(r.close) && r.date)
    .sort((a,b) => a.date.localeCompare(b.date));
  return {dates:rows.map(r=>r.date),prices:rows.map(r=>r.close)};
}

async function fetchStooq(stooqId, years=5) {
  const end = new Date();
  const start = new Date(end.getFullYear()-years, end.getMonth(), end.getDate());
  const fmt = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  // Weekly interval: i=w
  const url = `https://stooq.com/q/d/l/?s=${stooqId}&d1=${fmt(start)}&d2=${fmt(end)}&i=w`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Stooq HTTP ${res.status}`);
  const text = await res.text();
  if (!text.includes(',') || text.includes('No data')) throw new Error('Stooq: no data');
  const data = parseStooqCSV(text);
  if (data.prices.length < 20) throw new Error('Stooq: too few rows');
  return {...data, source:'stooq'};
}

async function fetchYahoo(yahooId, range='5y') {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(yahooId)}?interval=1wk&range=${range}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Yahoo HTTP ${res.status}`);
  const j = await res.json();
  const r = j.chart.result[0];
  const pairs = r.timestamp
    .map((t,i)=>({date:new Date(t*1000).toISOString().slice(0,10),close:r.indicators.quote[0].close[i]}))
    .filter(p=>p.close!=null);
  if (pairs.length < 20) throw new Error('Yahoo: too few rows');
  return {dates:pairs.map(p=>p.date),prices:pairs.map(p=>p.close),source:'yahoo'};
}

// Seeded random fallback
function seededRand(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function generateData(sym){
  const r=seededRand(sym.split('').reduce((a,c)=>a+c.charCodeAt(0),0));
  const isTW=sym.includes('.tw')||sym.includes('twii');
  let price=isTW?(sym.includes('2330')?600:sym.includes('2454')?1800:sym.includes('twii')?20000:95):(sym.includes('tsla')?250:sym.includes('nvda')?400:sym.includes('msft')?380:sym.includes('qqq')?350:460);
  const dates=[],prices=[];
  let d=new Date('2020-01-06');
  for(let i=0;i<260;i++){dates.push(d.toISOString().slice(0,10));prices.push(+price.toFixed(2));price*=Math.exp(0.0005+(0.022*(r()*2-1)));d=new Date(d.getTime()+7*86400000);}
  return {dates,prices,source:'simulated'};
}

async function loadSymbolData(sym, years) {
  const range = years<=1?'1y':years<=2?'2y':years<=5?'5y':'10y';
  const errors = [];
  // Try Stooq first
  try { return await fetchStooq(sym.stooq, years); } catch(e){ errors.push('Stooq: '+e.message); }
  // Try Yahoo as backup
  try { return await fetchYahoo(sym.yahoo, range); } catch(e){ errors.push('Yahoo: '+e.message); }
  // Fallback to simulated
  return {...generateData(sym.stooq), errors};
}

  const [params, setParams] = useState({

    macdFast:12,macdSlow:26,macdSignal:9,

  const load = useCallback(async()=>{
    setLoading(true); setNotice(null);
    const sym = SYMBOLS[symIdx];

    if(res.source==='stooq')       setNotice({ok:true,  msg:`✓ Stooq 資料載入成功 · ${res.prices.length} 筆週線資料`});
    else if(res.source==='yahoo')  setNotice({ok:true,  msg:`✓ Yahoo Finance 備援資料 · ${res.prices.length} 筆週線資料`});
    else setNotice({ok:false, msg:`⚠ 網路無法連線，使用模擬資料（計算邏輯相同）· ${res.errors?.join(' | ')}`});
    setLoading(false);
  }, [symIdx, years]);

  useEffect(()=>{ load(); }, [load]);
  useEffect(()=>{ if(data) setResult(runBacktest(data.prices,data.dates,strat,params)); }, [data,strat,params]);

  const chartData = useMemo(()=>{
    if(!result) return [];
    const bh=Object.fromEntries(result.bhEquity.map(b=>[b.date,b.bh]));
    return result.equity.map(e=>({date:e.date,s:+e.value.toFixed(2),b:+(bh[e.date]??100).toFixed(2)}));
  },[result]);

  const fmt=(n,d=2)=>(n>=0?'+':'')+n.toFixed(d)+'%';
  const C={card:{background:'#0d1520',border:'1px solid #131e2a',borderRadius:8,padding:'12px 14px'},
            sel:{background:'#0d1520',border:'1px solid #131e2a',borderRadius:6,color:'#e2e8f0',padding:'7px 10px',width:'100%',fontSize:12,cursor:'pointer',outline:'none'}};

  if(!result) return <div style={{background:'#080c12',height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#4a5568',fontFamily:'monospace',fontSize:13}}>{loading?'⟳ 載入資料中…':'初始化中…'}</div>;

  const alpha=stats.totalReturn-stats.bhReturn;

  return (
    <div style={{background:'#080c12',minHeight:'100vh',color:'#e2e8f0',fontFamily:"'DM Mono','Courier New',monospace",padding:20,boxSizing:'border-box'}}>

      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,paddingBottom:14,borderBottom:'1px solid #0f1c2a'}}>
        <div style={{width:5,height:28,background:'linear-gradient(180deg,#00D4AA,#4F9EFF)',borderRadius:3}}/>

          <h1 style={{margin:0,fontSize:17,fontWeight:800,color:'#fff',letterSpacing:-0.3}}>
            策略回測引擎 <span style={{fontSize:10,fontWeight:400,color:'#2d3748',letterSpacing:1}}>BACKTEST ENGINE v2.0</span>
          </h1>
          {notice&&<div style={{fontSize:11,color:notice.ok?'#00D4AA':'#FFB347',marginTop:3}}>{notice.msg}</div>}
        </div>

      {/* Controls */}

        <div>
          <div style={{fontSize:10,color:'#4a5568',textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>標的</div>
          <select value={symIdx} onChange={e=>setSymIdx(+e.target.value)} style={C.sel}>

          {l:'超額報酬 Alpha',v:fmt(alpha),c:alpha>=0?'#00D4AA':'#FF6B6B',s:alpha>=0?'✓ 優於大盤':'✗ 落後大盤'},

          {l:'交易次數',v:String(stats.numTrades),c:'#a0aec0',s:'買+賣=1次'},
          {l:'勝率',v:((stats.winRate||0)*100).toFixed(1)+'%',c:stats.winRate>=0.5?'#00D4AA':'#FF6B6B',s:`${Math.round(stats.winRate*stats.numTrades)}勝 ${stats.numTrades-Math.round(stats.winRate*stats.numTrades)}敗`},
          {l:'平均報酬/筆',v:fmt(stats.avgReturn,1),c:stats.avgReturn>=0?'#00D4AA':'#FF6B6B',s:`平均持倉${stats.avgDays.toFixed(0)}天`},

      <div style={{display:'flex',gap:0,borderBottom:'1px solid #0f1c2a'}}>
        {[['equity','📈 權益曲線'],['trades','📋 交易紀錄']].map(([k,l])=>(
          <button key={k} onClick={()=>setTab(k)} style={{background:'none',border:'none',borderBottom:tab===k?'2px solid #4F9EFF':'2px solid transparent',color:tab===k?'#4F9EFF':'#4a5568',padding:'8px 18px',cursor:'pointer',fontSize:12,fontWeight:tab===k?700:400,marginBottom:-1,fontFamily:'inherit'}}>
            {l}
          </button>
        ))}
      </div>

      {tab==='equity'&&(
        <div style={{...C.card,borderRadius:'0 8px 8px 8px',padding:'14px 8px'}}>
          <div style={{display:'flex',gap:16,paddingLeft:8,marginBottom:10}}>
            <div style={{display:'flex',alignItems:'center',gap:5}}><div style={{width:20,height:2,background:'#00D4AA'}}/><span style={{fontSize:11,color:'#718096'}}>策略淨值</span></div>
            <div style={{display:'flex',alignItems:'center',gap:5}}><div style={{width:20,height:0,borderTop:'2px dashed #4F9EFF'}}/><span style={{fontSize:11,color:'#718096'}}>買入持有</span></div>
          </div>
          <ResponsiveContainer width="100%" height={300}>
            <LineChart data={chartData} margin={{top:4,right:18,left:0,bottom:4}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#0c1820"/>
              <XAxis dataKey="date" tick={{fill:'#2d3748',fontSize:10}} tickLine={false} axisLine={false} tickFormatter={v=>v.slice(2,7)} interval={tickInterval}/>
              <YAxis tick={{fill:'#2d3748',fontSize:10}} tickLine={false} axisLine={false} tickFormatter={v=>v.toFixed(0)} width={38}/>
              <Tooltip content={<CTip/>}/>
              <ReferenceLine y={100} stroke="#1a2535" strokeDasharray="3 3"/>
              <Line dataKey="s" stroke="#00D4AA" dot={false} strokeWidth={2} name="s"/>
              <Line dataKey="b" stroke="#4F9EFF" dot={false} strokeWidth={1.5} strokeDasharray="5 3" name="b"/>
            </LineChart>
          </ResponsiveContainer>
        </div>
      )}

      {tab==='trades'&&(
        <div style={{...C.card,borderRadius:'0 8px 8px 8px',padding:0,maxHeight:380,overflowY:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
            <thead style={{position:'sticky',top:0,background:'#0d1520',zIndex:1}}>
              <tr style={{borderBottom:'1px solid #131e2a'}}>
                {['#','買入日','賣出日','買入價','賣出價','持倉(週)','報酬率'].map(h=>(
                  <th key={h} style={{padding:'9px 12px',textAlign:'left',color:'#4a5568',fontWeight:600,textTransform:'uppercase',letterSpacing:.5,whiteSpace:'nowrap'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {trades.length===0
                ?<tr><td colSpan={7} style={{padding:28,textAlign:'center',color:'#4a5568'}}>無交易訊號，請調整參數</td></tr>
                :trades.map((t,i)=>(
                  <tr key={i} style={{borderBottom:'1px solid #090e14',background:i%2?'#060a0f':'transparent'}}>
                    <td style={{padding:'7px 12px',color:'#4a5568'}}>{i+1}</td>
                    <td style={{padding:'7px 12px',color:'#a0aec0'}}>{t.ed}</td>
                    <td style={{padding:'7px 12px',color:'#a0aec0'}}>{t.xd}{t.open&&<span style={{color:'#FFB347',fontSize:9,marginLeft:4}}>[持倉中]</span>}</td>
                    <td style={{padding:'7px 12px',color:'#e2e8f0'}}>{t.ep.toFixed(2)}</td>
                    <td style={{padding:'7px 12px',color:'#e2e8f0'}}>{t.xp.toFixed(2)}</td>
                    <td style={{padding:'7px 12px',color:'#718096'}}>{t.days}</td>
                    <td style={{padding:'7px 12px',fontWeight:700,color:t.ret>=0?'#00D4AA':'#FF6B6B'}}>{(t.ret>=0?'+':'')+(t.ret*100).toFixed(2)+'%'}</td>
                  </tr>
                ))
              }
            </tbody>
          </table>
        </div>
      )}

      <div style={{marginTop:10,color:'#131e2a',fontSize:9,textAlign:'center'}}>
        資料來源：Stooq.com（主）/ Yahoo Finance（備）· 週線資料 · 不含手續費滑價 · ⚠ 不構成投資建議
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
