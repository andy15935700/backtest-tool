<script>
// ── Math ─────────────────────────────────────────────────────────
const mean = a=>a.reduce((s,v)=>s+v,0)/a.length;
const std  = a=>{const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length);};

function bollinger(prices,per=20,mult=2){
  return prices.map((_,i)=>{
    if(i<per-1)return{pctB:null};
    const sl=prices.slice(i-per+1,i+1),m=mean(sl),sd=std(sl);
    const up=m+mult*sd,lo=m-mult*sd;
    return{pctB:(prices[i]-lo)/(up-lo||1e-9)};
  });
}
function rsi(prices,per=14){
  const r=new Array(prices.length).fill(null);
  let ag=0,al=0;
  for(let i=1;i<=per;i++){const d=prices[i]-prices[i-1];if(d>0)ag+=d/per;else al+=Math.abs(d)/per;}
  r[per]=100-100/(1+ag/(al||1e-9));
  for(let i=per+1;i<prices.length;i++){
    const d=prices[i]-prices[i-1];
    ag=(ag*(per-1)+(d>0?d:0))/per; al=(al*(per-1)+(d<0?-d:0))/per;
    r[i]=100-100/(1+ag/(al||1e-9));
  }
  return r;
}
function ema(prices,per){
  const k=2/(per+1),e=new Array(prices.length).fill(null);
  e[per-1]=mean(prices.slice(0,per));
  for(let i=per;i<prices.length;i++)e[i]=prices[i]*k+e[i-1]*(1-k);
  return e;
}
function macd(prices,f=12,s=26,sig=9){
  const ef=ema(prices,f),es=ema(prices,s);
  const ml=prices.map((_,i)=>ef[i]!=null&&es[i]!=null?ef[i]-es[i]:null);
  const sl=ema(ml.map(v=>v??0),sig);
  return ml.map((m,i)=>({macd:m,signal:sl[i]}));
}

// ── Backtest ──────────────────────────────────────────────────────
function backtest(prices,dates,strat,p){
  let pos=null,cash=100,shares=0;
  const trades=[],equity=[{date:dates[0],val:100}];
  const bo=strat==='bollinger'?bollinger(prices,p.bPer,p.bMult):null;
  const ri=strat==='rsi'?rsi(prices,p.rPer):null;
  const ef=strat==='ma_cross'?ema(prices,p.maF):null;
  const es=strat==='ma_cross'?ema(prices,p.maS):null;
  const ma=strat==='macd'?macd(prices,p.mF,p.mS,p.mSig):null;

  for(let i=1;i<prices.length;i++){
    const pr=prices[i];let buy=false,sell=false;
    if(strat==='bollinger'){
      const pb=bo[i].pctB,pp=bo[i-1].pctB;
      if(pb!=null&&pp!=null){buy=pb<p.bBuy&&pp>=p.bBuy;sell=pb>p.bSell&&pp<=p.bSell;}
    }else if(strat==='rsi'){
      if(ri[i]!=null&&ri[i-1]!=null){buy=ri[i]<p.rBuy&&ri[i-1]>=p.rBuy;sell=ri[i]>p.rSell&&ri[i-1]<=p.rSell;}
    }else if(strat==='ma_cross'){
      if(ef[i]&&es[i]&&ef[i-1]&&es[i-1]){buy=ef[i]>es[i]&&ef[i-1]<=es[i-1];sell=ef[i]<es[i]&&ef[i-1]>=es[i-1];}
    }else if(strat==='macd'){
      const c=ma[i],pv=ma[i-1];
      if(c.macd!=null&&pv.macd!=null){buy=c.macd>c.signal&&pv.macd<=pv.signal;sell=c.macd<c.signal&&pv.macd>=pv.signal;}
    }
    if(!pos&&buy){pos={ep:pr,ed:dates[i],ei:i};shares=cash/pr;cash=0;}
    else if(pos&&sell){
      trades.push({ed:pos.ed,xd:dates[i],ep:pos.ep,xp:pr,ret:(pr-pos.ep)/pos.ep,days:i-pos.ei});
      cash=shares*pr;shares=0;pos=null;
    }
    equity.push({date:dates[i],val:+((pos?shares*pr:cash)).toFixed(4)});
  }
  if(pos){
    const lp=prices[prices.length-1];
    trades.push({ed:pos.ed,xd:dates[dates.length-1],ep:pos.ep,xp:lp,ret:(lp-pos.ep)/pos.ep,days:prices.length-1-pos.ei,open:true});
    equity[equity.length-1].val=+(shares*lp).toFixed(4);
  }
  const bh=prices.map((pr,i)=>({date:dates[i],bh:+((pr/prices[0])*100).toFixed(4)}));
  let peak=100,maxDD=0;
  for(const e of equity){if(e.val>peak)peak=e.val;const dd=(peak-e.val)/peak;if(dd>maxDD)maxDD=dd;}
  const rets=equity.slice(1).map((e,i)=>e.val/equity[i].val-1);
  const aR=mean(rets),rSd=std(rets);
  const sharpe=rSd>0?(aR/rSd)*Math.sqrt(52):0;
  const wins=trades.filter(t=>t.ret>0);
  const fin=equity[equity.length-1].val;
  return{equity,bh,trades,s:{
    tot:fin-100,bh:(prices[prices.length-1]/prices[0]-1)*100,
    n:trades.length,wr:trades.length>0?wins.length/trades.length:0,
    dd:maxDD*100,sharpe,
    aRet:trades.length>0?mean(trades.map(t=>t.ret))*100:0,
    aDays:trades.length>0?mean(trades.map(t=>t.days)):0,
  }};
}

// ── Data Fetch ────────────────────────────────────────────────────
function parseCSV(text){
  const lines=text.trim().split('\n').slice(1);
  const rows=lines.map(l=>{const p=l.split(',');return{date:p[0],close:parseFloat(p[4])};})
    .filter(r=>!isNaN(r.close)&&r.date&&r.date.length===10)
    .sort((a,b)=>a.date.localeCompare(b.date));
  return{dates:rows.map(r=>r.date),prices:rows.map(r=>r.close)};
}
async function fetchStooq(id,years){
  const e=new Date(),s=new Date(e.getFullYear()-years,e.getMonth(),e.getDate());
  const f=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const url=`https://stooq.com/q/d/l/?s=${id}&d1=${f(s)}&d2=${f(e)}&i=w`;
  const res=await fetch(url);
  if(!res.ok)throw new Error('HTTP '+res.status);
  const text=await res.text();
  if(!text.includes(',')||text.includes('No data'))throw new Error('no data');
  const data=parseCSV(text);
  if(data.prices.length<10)throw new Error('too few rows');
  return{...data,source:'stooq'};
}
async function fetchYahoo(id,years){
  const range=years<=1?'1y':years<=2?'2y':years<=5?'5y':'10y';
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(id)}?interval=1wk&range=${range}`;
  const res=await fetch(url);
  if(!res.ok)throw new Error('HTTP '+res.status);
  const j=await res.json();
  const r=j.chart.result[0];
  const pairs=r.timestamp.map((t,i)=>({date:new Date(t*1000).toISOString().slice(0,10),close:r.indicators.quote[0].close[i]})).filter(p=>p.close!=null);
  if(pairs.length<10)throw new Error('too few');
  return{dates:pairs.map(p=>p.date),prices:pairs.map(p=>p.close),source:'yahoo'};
}
function seededRand(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function simData(stooqId){
  const r=seededRand(stooqId.split('').reduce((a,c)=>a+c.charCodeAt(0),0));
  const isTW=stooqId.includes('.tw')||stooqId.includes('twii');
  let price=isTW?(stooqId.includes('2330')?600:stooqId.includes('2454')?1800:stooqId.includes('twii')?20000:95):(stooqId.includes('tsla')?250:stooqId.includes('nvda')?400:460);
  const dates=[],prices=[];
  let d=new Date('2020-01-06');
  for(let i=0;i<260;i++){dates.push(d.toISOString().slice(0,10));prices.push(+price.toFixed(2));price*=Math.exp(5e-4+(0.022*(r()*2-1)));d=new Date(d.getTime()+7*864e5);}
  return{dates,prices,source:'simulated'};
}
async function loadData(stooqId,yahooId,years){
  try{return await fetchStooq(stooqId,years);}catch(e){console.warn('Stooq fail:',e.message);}
  try{return await fetchYahoo(yahooId,years);}catch(e){console.warn('Yahoo fail:',e.message);}
  return simData(stooqId);
}

// ── State ─────────────────────────────────────────────────────────
let priceData=null,result=null,chartInst=null;
const P={bPer:20,bMult:2,bBuy:0.2,bSell:0.8,rPer:14,rBuy:30,rSell:70,maF:10,maS:30,mF:12,mS:26,mSig:9};

// ── Sliders Config ────────────────────────────────────────────────
const SLIDERS={
  bollinger:[
    {k:'bPer',l:'週期',min:5,max:50,step:1},
    {k:'bMult',l:'乘數',min:1,max:3,step:0.1},
    {k:'bBuy',l:'買入 %B',min:0.05,max:0.45,step:0.05},
    {k:'bSell',l:'賣出 %B',min:0.55,max:0.95,step:0.05},
  ],
  rsi:[
    {k:'rPer',l:'RSI週期',min:5,max:30,step:1},
    {k:'rBuy',l:'超賣買入',min:10,max:45,step:1},
    {k:'rSell',l:'超買賣出',min:55,max:90,step:1},
  ],
  ma_cross:[
    {k:'maF',l:'快線 EMA',min:3,max:30,step:1},
    {k:'maS',l:'慢線 EMA',min:10,max:120,step:1},
  ],
  macd:[
    {k:'mF',l:'快線',min:5,max:20,step:1},
    {k:'mS',l:'慢線',min:15,max:40,step:1},
    {k:'mSig',l:'訊號',min:3,max:15,step:1},
  ],
};

function renderSliders(){
  const strat=document.getElementById('selStrat').value;
  const wrap=document.getElementById('sliders');
  wrap.innerHTML='';
  (SLIDERS[strat]||[]).forEach(s=>{
    const div=document.createElement('div');div.className='slider-wrap';
    div.innerHTML=`
      <div class="slider-label"><span>${s.l}</span><span class="slider-val" id="sv_${s.k}">${P[s.k]}</span></div>
      <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${P[s.k]}" id="sl_${s.k}">
      <div class="slider-minmax"><span>${s.min}</span><span>${s.max}</span></div>`;
    wrap.appendChild(div);
    document.getElementById('sl_'+s.k).addEventListener('input',e=>{
      P[s.k]=+e.target.value;
      document.getElementById('sv_'+s.k).textContent=P[s.k];
      if(priceData)runAndRender();
    });
  });
}

function renderKPIs(s){
  const fmt=(n,d=2)=>(n>=0?'+':'')+n.toFixed(d)+'%';
  const alpha=s.tot-s.bh;
  const cards=[
    {l:'策略總報酬',v:fmt(s.tot),c:s.tot>=0?'#00D4AA':'#FF6B6B',sub:'初始資金=100'},
    {l:'買入持有報酬',v:fmt(s.bh),c:s.bh>=0?'#4F9EFF':'#FF6B6B',sub:'同期Benchmark'},
    {l:'超額報酬 Alpha',v:fmt(alpha),c:alpha>=0?'#00D4AA':'#FF6B6B',sub:alpha>=0?'✓ 優於大盤':'✗ 落後大盤'},
    {l:'夏普率',v:s.sharpe.toFixed(2),c:s.sharpe>1?'#00D4AA':s.sharpe>0?'#FFB347':'#FF6B6B',sub:'>1優秀 >0正向'},
    {l:'最大回撤',v:'-'+s.dd.toFixed(1)+'%',c:'#FF6B6B',sub:'資金最深虧損'},
    {l:'交易次數',v:s.n,c:'#a0aec0',sub:'買+賣=1次'},
    {l:'勝率',v:((s.wr||0)*100).toFixed(1)+'%',c:s.wr>=0.5?'#00D4AA':'#FF6B6B',sub:`${Math.round(s.wr*s.n)}勝 ${s.n-Math.round(s.wr*s.n)}敗`},
    {l:'平均報酬/筆',v:fmt(s.aRet,1),c:s.aRet>=0?'#00D4AA':'#FF6B6B',sub:`平均持倉${s.aDays.toFixed(0)}天`},
  ];
  document.getElementById('kpis').innerHTML=cards.map(c=>`
    <div class="kpi">
      <div class="kpi-label">${c.l}</div>
      <div class="kpi-val" style="color:${c.c}">${c.v}</div>
      <div class="kpi-sub">${c.sub}</div>
    </div>`).join('');
}

function renderChart(eq,bh){
  const labels=eq.map(e=>e.date.slice(2,7));
  const every=Math.max(1,Math.floor(labels.length/10));
  const shown=labels.map((l,i)=>i%every===0?l:'');
  if(chartInst){chartInst.destroy();chartInst=null;}
  const ctx=document.getElementById('myChart').getContext('2d');
  chartInst=new Chart(ctx,{
    type:'line',
    data:{
      labels:shown,
      datasets:[
        {label:'策略淨值',data:eq.map(e=>e.val),borderColor:'#00D4AA',borderWidth:2,pointRadius:0,tension:0.1,fill:false},
        {label:'買入持有',data:bh.map(e=>e.bh),borderColor:'#4F9EFF',borderWidth:1.5,borderDash:[5,3],pointRadius:0,tension:0.1,fill:false},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      animation:{duration:300},
      plugins:{
        legend:{display:false},
        tooltip:{
          mode:'index',intersect:false,
          backgroundColor:'#0d1520',borderColor:'#1e2d40',borderWidth:1,
          titleColor:'#718096',bodyColor:'#e2e8f0',
          callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.raw?.toFixed(2)}`}
        }
      },
      scales:{
        x:{grid:{color:'#0c1820'},ticks:{color:'#2d3748',font:{size:10}},border:{dash:[3,3]}},
        y:{grid:{color:'#0c1820'},ticks:{color:'#2d3748',font:{size:10}},border:{dash:[3,3]}}
      }
    }
  });
}

function renderTrades(trades){
  const tb=document.getElementById('tradesTbody');
  if(trades.length===0){
    tb.innerHTML='<tr><td colspan="7" style="padding:28px;text-align:center;color:#4a5568">無交易訊號，請調整參數</td></tr>';
    return;
  }
  tb.innerHTML=trades.map((t,i)=>`
    <tr>
      <td class="dim">${i+1}</td>
      <td class="mid">${t.ed}</td>
      <td class="mid">${t.xd}${t.open?'<span class="amber" style="font-size:9px;margin-left:4px">[持倉中]</span>':''}</td>
      <td class="white">${t.ep.toFixed(2)}</td>
      <td class="white">${t.xp.toFixed(2)}</td>
      <td class="mid">${t.days}</td>
      <td style="font-weight:700" class="${t.ret>=0?'green':'red'}">${(t.ret>=0?'+':'')+(t.ret*100).toFixed(2)}%</td>
    </tr>`).join('');
}

function runAndRender(){
  const strat=document.getElementById('selStrat').value;
  result=backtest(priceData.prices,priceData.dates,strat,P);
  renderKPIs(result.s);
  renderChart(result.equity,result.bh);
  renderTrades(result.trades);
}

function setNotice(msg,cls){
  const el=document.getElementById('notice');
  el.textContent=msg;el.className='notice '+cls;
}

async function doLoad(){
  const symVal=document.getElementById('selSym').value;
  const [stooqId,yahooId]=symVal.split('|');
  const years=+document.getElementById('selYears').value;
  document.getElementById('loading').classList.add('show');
  document.getElementById('btnLoad').disabled=true;
  setNotice('⟳ 正在載入資料…','warn');
  priceData=await loadData(stooqId,yahooId,years);
  document.getElementById('loading').classList.remove('show');
  document.getElementById('btnLoad').disabled=false;
  if(priceData.source==='stooq')       setNotice(`✓ Stooq 資料載入成功 · ${priceData.prices.length} 筆週線`,'ok');
  else if(priceData.source==='yahoo')  setNotice(`✓ Yahoo Finance 備援 · ${priceData.prices.length} 筆週線`,'ok');
  else setNotice('⚠ 網路無法連線，使用模擬資料示意（計算邏輯相同）','warn');
  runAndRender();
}

// ── Tab switching ─────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const t=btn.dataset.tab;
    document.getElementById('tabEquity').style.display=t==='equity'?'block':'none';
    document.getElementById('tabTrades').style.display=t==='trades'?'block':'none';
  });
});

// ── Event listeners ───────────────────────────────────────────────
document.getElementById('btnLoad').addEventListener('click',doLoad);
document.getElementById('selSym').addEventListener('change',doLoad);
document.getElementById('selYears').addEventListener('change',doLoad);
document.getElementById('selStrat').addEventListener('change',()=>{renderSliders();if(priceData)runAndRender();});

// ── Init ──────────────────────────────────────────────────────────
renderSliders();
doLoad();
</script>
</body>
</html>
